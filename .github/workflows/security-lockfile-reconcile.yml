name: Refresh security dependency locks

on:
  push:
    branches:
      - fix/security-hardening-importer-20261014
      - fix/security-integrated-main-20261014
      - dependabot/npm_and_yarn/npm_and_yarn-85619b0fa2
      - perf/mobile-lcp-rls-20261021
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/security-lockfile-reconcile.yml

permissions:
  contents: write

concurrency:
  group: security-lock-reconcile
  cancel-in-progress: false

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Re-resolve patched dependency tree without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Verify clean npm installation
        run: npm ci --ignore-scripts --no-audit
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Sync the Bun lockfile without package scripts
        run: bun install --lockfile-only --ignore-scripts
      - name: Restrict generated changes to lockfiles
        run: |
          git add -- package-lock.json bun.lock
          git diff --cached --stat
          git diff --cached --check
      - name: Commit generated locks to this security branch only
        run: |
          if git diff --cached --quiet; then
            echo "No lockfile updates needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(lock): regenerate patched dependency locks"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
