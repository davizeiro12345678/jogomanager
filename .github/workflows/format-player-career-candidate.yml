name: Format player career release candidate

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/format-player-career-candidate.yml"
      - "src/**"
      - "package-lock.json"

permissions:
  contents: write

jobs:
  prettier:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/player-career-release-candidate-20261015' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format known career files
        run: |
          npx prettier --write \
            src/game/career-hub.ts \
            src/game/career-hub.test.ts \
            src/game/player-career \
            src/routes/carreiras.tsx \
            src/routes/jogador.novo.tsx \
            src/routes/jogador.painel.tsx \
            src/components/game/athlete \
            src/hooks/useAthlete.ts \
            src/lib/player-career-schema.ts \
            src/lib/player-career-schema.test.ts \
            src/lib/player-career-store.ts \
            src/lib/player-career-store.test.ts \
            src/lib/player-career.functions.ts
      - name: Commit formatting changes
        run: |
          if test -n "$(git status --porcelain)"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/
            git diff --cached --check
            git commit -m "style(player-career): apply repository Prettier formatting"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
