name: Build and compare WASM rig candidate
on:
  pull_request:
    paths:
      - wasm/crowd-visibility/src/rig_section.rs
      - src/game/wasm/pkg/crowd_visibility_wasm_bg.wasm
      - scripts/compare-rig-wasm.mjs
      - .github/workflows/rig-wasm-build-evidence.yml
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm/crowd-visibility
      - name: Check formatting and native Rust tests
        run: |
          cargo fmt --manifest-path wasm/crowd-visibility/Cargo.toml -- --check
          cargo test --manifest-path wasm/crowd-visibility/Cargo.toml --locked
      - name: Install pinned WASM packaging tool
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Build and compare against the PR base
        env:
          PFM_WASM_PACK_CACHE: ${{ runner.temp }}/wasm-pack-cache
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$BASE_SHA":src/game/wasm/pkg/crowd_visibility_wasm_bg.wasm > "$RUNNER_TEMP/rig-baseline.wasm"
          npm run wasm:build
          git diff --exit-code -- src/game/wasm/pkg/crowd_visibility_wasm.d.ts src/game/wasm/pkg/crowd_visibility_wasm.js src/game/wasm/pkg/crowd_visibility_wasm_bg.wasm.d.ts src/game/wasm/pkg/package.json
          node scripts/compare-rig-wasm.mjs "$RUNNER_TEMP/rig-baseline.wasm" src/game/wasm/pkg/crowd_visibility_wasm_bg.wasm
          sha256sum "$RUNNER_TEMP/rig-baseline.wasm" src/game/wasm/pkg/crowd_visibility_wasm_bg.wasm
      - name: Upload generated WASM for the draft branch
        uses: actions/upload-artifact@v4
        with:
          name: optimized-rig-wasm
          path: src/game/wasm/pkg/crowd_visibility_wasm_bg.wasm
          if-no-files-found: error
