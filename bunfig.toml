[install]
saveTextLockfile = true
# Seven-day supply-chain quarantine for newly published npm package versions.
minimumReleaseAge = 604800
# Existing project-specific exemptions bypass the seven-day guard; audit each
# before adding any.
minimumReleaseAgeExcludes = ["@lovable.dev/vite-tanstack-config", "@lovable.dev/mcp-js", "@lovable.dev/email-js", "@lovable.dev/webhooks-js"]
