# 43 named executable Vitest acceptance suites, mapped to existing regression tests.
# The matrix is one runner to control CI cost; each step retains an independent outcome.
# Run for every PR targeting main before this context is made a required check.
# It does NOT certify physical devices, external staging or a human code review.
name: PR 132 43-suite acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr132-43-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: PR132 43 regression acceptance suites
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref_name == 'integration/release-2026-11-11') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Node from repository toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify immutable head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Install exact locked dependencies
        id: install
        run: npm ci
      - name: Verify acceptance-report validation
        run: node --test scripts/verify-pr132-suite.test.mjs
      - name: "01/43 identity: auth transport"
        id: gate01
        if: ${{ always() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: |
          rm -f "$RUNNER_TEMP/pr132-suite.json"
          npm exec -- vitest run src/lib/auth-transport.test.ts --pool=forks --maxWorkers=1 --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/pr132-suite.json"
          node scripts/verify-pr132-suite.mjs "$RUNNER_TEMP/pr132-suite.json" src/lib/auth-transport.test.ts
      - name: "02/43 identity: social OAuth"
