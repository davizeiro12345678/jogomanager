name: One-shot PR 132 formatting repair

on:
  push:
    branches:
      - integration/release-2026-11-11
    paths:
      - .github/workflows/pr132-format-once.yml

permissions:
  contents: write

concurrency:
  group: pr132-one-shot-formatting
  cancel-in-progress: false

jobs:
  format:
    if: github.repository == 'davizeiro12345678/jogomanager'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format only the files modified for PR 132 human moderation and match authority
        run: |
          npm exec -- prettier --write \
            src/components/support/ModerationReviewCenter.tsx \
            src/pages/contato.tsx \
            src/i18n/moderation-review-messages.ts \
            src/lib/moderation-review.functions.ts \
            src/lib/moderation-review-input.ts \
            src/lib/moderation-review-input.test.ts \
            src/game/online/authoritative-two-client.integration.test.ts \
            src/game/online/cooperative-command-policy.server.ts \
            src/game/online/cooperative-command-policy.server.test.ts \
            src/game/match-physics-extras.ts \
            src/game/match-physics-extras.test.ts \
            src/game/sim-ball-duels.ts \
            src/game/sim.ts \
            src/game/ai-ball-interception.ts \
            src/game/ai-ball-interception.test.ts \
            src/game/graphics/shadow-map-budget.ts \
            src/game/graphics/shadow-map-budget.test.ts \
            src/components/game/stadium/StadiumScene.tsx \
            src/integrations/supabase/database.ts
      - name: Commit only formatting to integration branch
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            src/components/support/ModerationReviewCenter.tsx \
            src/pages/contato.tsx \
            src/i18n/moderation-review-messages.ts \
            src/lib/moderation-review.functions.ts \
            src/lib/moderation-review-input.ts \
            src/lib/moderation-review-input.test.ts \
            src/game/online/authoritative-two-client.integration.test.ts \
            src/game/online/cooperative-command-policy.server.ts \
            src/game/online/cooperative-command-policy.server.test.ts \
            src/game/match-physics-extras.ts \
            src/game/match-physics-extras.test.ts \
            src/game/sim-ball-duels.ts \
            src/game/sim.ts \
            src/game/ai-ball-interception.ts \
            src/game/ai-ball-interception.test.ts \
            src/game/graphics/shadow-map-budget.ts \
            src/game/graphics/shadow-map-budget.test.ts \
            src/components/game/stadium/StadiumScene.tsx \
            src/integrations/supabase/database.ts
          if git diff --cached --quiet; then
            echo 'All files already formatted.'
            exit 0
          fi
          git commit -m 'style(pr132): resolve strict formatting in moderation and multiplayer integration'
          git push origin HEAD:integration/release-2026-11-11
