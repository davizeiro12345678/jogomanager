name: Publish JogoManager to Cloudflare

on:
  workflow_run:
    workflows: ["Quality gates"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: jogomanager-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    # A successful PR workflow is not authority to publish. Only a successful
    # quality gate on the production branch may trigger a Wrangler deployment.
    if: >-
      ${{
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify production credentials are connected
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$VITE_SUPABASE_URL" || { echo "Missing VITE_SUPABASE_URL secret"; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "Missing VITE_SUPABASE_PUBLISHABLE_KEY secret"; exit 1; }
      - run: npm ci
      - name: Build and publish Worker with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 31b4ec9dfe5281c893ccfaaaefcfc88d
          CLOUDFLARE_SITE_ZONE: jogomanager.com
          SITE_URL: https://jogomanager.com
          VITE_AUTH_MODE: supabase
          PAYMENTS_ENVIRONMENT: live
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run cloudflare:deploy
      - name: Verify production HTTP health and public access without Cloudflare login
        run: |
          # HTTP 302 to Cloudflare Access is not a successful public deployment.
          node --input-type=module <<'NODE'
          const checks = [
            { url: "https://jogomanager.com/api/health", type: "json" },
            { url: "https://jogomanager.com/", type: "html" },
            { url: "https://www.jogomanager.com/", type: "html", followCanonical: true },
          ];

          for (const { url, type, followCanonical } of checks) {
            const response = await fetch(url, {
              redirect: followCanonical ? "follow" : "manual",
              headers: { "cache-control": "no-cache" },
              signal: AbortSignal.timeout(30000),
            });
            if (response.status !== 200) {
              throw new Error(`${url}: expected HTTP 200 for anonymous visitors; got ${response.status} (Location: ${response.headers.get("location") || "none"})`);
            }
            if (/cloudflareaccess\\.com|\\/cdn-cgi\\/access\\//i.test(response.url)) {
              throw new Error(`${url}: redirected to Cloudflare Access login`);
            }
            const body = await response.text();
            if (/Cloudflare Access|\\/cdn-cgi\\/access\\/login|Log in to .*Cloudflare Workers/i.test(body)) {
              throw new Error(`${url}: Cloudflare Access login page served instead of the public app`);
            }
            const contentType = response.headers.get("content-type") || "";
            if (type === "json") {
              if (!contentType.includes("application/json")) {
                throw new Error(`${url}: expected JSON health, received ${contentType}`);
              }
              const health = JSON.parse(body);
              if (health.status !== "ready") {
                throw new Error(`${url}: backend health is not ready: ${health.status}`);
              }
            } else {
              if (!contentType.includes("text/html") || !/Pro Football Manager 3D/i.test(body)) {
                throw new Error(`${url}: expected public game HTML, got unexpected content`);
              }
            }
            console.log(`PASS anonymous public access: ${url}`);
          }
          NODE
