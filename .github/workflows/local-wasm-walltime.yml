name: CodSpeed WASM walltime comparison
on:
  push:
    branches: [codspeed/local-wasm-20261007]
    paths: [.github/workflows/local-wasm-walltime.yml]
permissions:
  contents: read
  id-token: write
jobs:
  walltime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 359be9b29a76334c3aaf9aef0da62ef08654009b
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node performance/wasm-workload.mjs verify
      - uses: CodSpeedHQ/action@v5
        with:
          mode: walltime
          config: codspeed.yml
