name: Match 3D mobile draw inventory
on:
  pull_request:
    paths:
      - "src/components/game/**"
      - "src/game/**"
      - "scripts/GraphicsBenchmarkApp.tsx"
      - "scripts/graphics-draw-inventory.ts"
      - ".github/scripts/inspect-mobile-scene.mjs"
      - ".github/workflows/match3d-mobile-draws.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run graphics:build
      - name: Inspect real mobile draws
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/draw-qa/node_modules/playwright
        run: |
          npm install --prefix "$RUNNER_TEMP/draw-qa" --no-package-lock --no-save playwright@1.62.1
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE="$(command -v google-chrome)"
          node .github/scripts/inspect-mobile-scene.mjs "$RUNNER_TEMP/mobile-draw-inventory" "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mobile-draw-inventory
          path: ${{ runner.temp }}/mobile-draw-inventory
          if-no-files-found: error
          retention-days: 14
