name: Match 3D lifecycle and context recovery
on:
  pull_request:
    paths:
      - "src/components/game/**"
      - "src/game/**"
      - ".github/scripts/capture-match3d-lifecycle.mjs"
      - ".github/workflows/match3d-lifecycle.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run graphics:build
      - name: Run native resource cycles and forced context restoration
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/lifecycle-qa/node_modules/playwright
        run: |
          npm install --prefix "$RUNNER_TEMP/lifecycle-qa" --no-package-lock --no-save playwright@1.62.1
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE="$(command -v google-chrome)"
          node .github/scripts/capture-match3d-lifecycle.mjs "$RUNNER_TEMP/match3d-lifecycle" "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: match3d-lifecycle
          path: ${{ runner.temp }}/match3d-lifecycle
          if-no-files-found: error
          retention-days: 14
