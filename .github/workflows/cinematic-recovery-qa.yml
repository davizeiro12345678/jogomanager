name: Cinematic recovery browser QA

on:
  push:
    branches: [qa/pr132-cinematic-recovery-20261115]
  pull_request:
    paths:
      - "src/components/game/**"
      - "src/game/**"
      - "scripts/**"
      - ".github/workflows/cinematic-recovery-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cinematic-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery:
    name: Recover cinematic after failed 3D download
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run graphics:build
      - name: Install isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/cinematic-qa" --no-package-lock --no-save playwright@1.62.1
          command -v google-chrome > "$RUNNER_TEMP/cinematic-chrome-path"
      - name: Exercise transient failure, retry and illustrated fallback
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/cinematic-qa/node_modules/playwright
          EVIDENCE_DIR: ${{ runner.temp }}/cinematic-recovery
          TEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE="$(cat "$RUNNER_TEMP/cinematic-chrome-path")"
          node scripts/cinematic-recovery-browser-qa.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cinematic-recovery-browser-qa
          path: ${{ runner.temp }}/cinematic-recovery/
          if-no-files-found: warn
          retention-days: 14
