name: Format career TSX changes safely
on:
  push:
    branches:
      - fix/career-ci-format-types-20261015
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[format-done]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install verified lockfile
        run: npm ci
      - name: Format only the career feature files
        run: |
          npm exec -- prettier --write \
            src/game/career-hub.ts \
            src/game/career-hub.test.ts \
            src/game/player-career/objectives.ts \
            src/game/player-career/objectives.test.ts \
            src/routes/carreiras.tsx \
            src/routes/jogador.novo.tsx \
            src/routes/jogador.painel.tsx
      - name: Save isolated formatting commit
        run: |
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/game/career-hub.ts src/game/career-hub.test.ts src/game/player-career/objectives.ts src/game/player-career/objectives.test.ts src/routes/carreiras.tsx src/routes/jogador.novo.tsx src/routes/jogador.painel.tsx
            git commit -m "style(career): enforce Prettier format [format-done]"
            git push origin HEAD:fix/career-ci-format-types-20261015
          fi
