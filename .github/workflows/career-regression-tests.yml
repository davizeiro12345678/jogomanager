name: Verify career tests in isolation
on:
  push:
    branches:
      - fix/career-ci-format-types-20261015
permissions:
  contents: read
jobs:
  career:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test player season goals, simulations, and career hub
        run: npm exec -- vitest run src/game/player-career/objectives.test.ts src/game/player-career/engine.test.ts src/game/career-hub.test.ts --pool=forks --maxWorkers=1
