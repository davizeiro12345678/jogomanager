name: Quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm exec -- tsc --noEmit --pretty false 2>&1 | tee tsc.log; exit "${PIPESTATUS[0]}"
      - name: Publish typecheck output
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            let text = "(sem saída capturada)";
            try {
              text = fs.readFileSync("tsc.log", "utf8");
            } catch (error) {
              text = `falha ao ler tsc.log: ${error.message}`;
            }
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: "typecheck-output",
              head_sha: context.payload.pull_request.head.sha,
              status: "completed",
              conclusion: "neutral",
              output: {
                title: "tsc --noEmit",
                summary: "Saída do typecheck que falhou nesta execução.",
                text: text.slice(0, 60000),
              },
            });
      # The stress suite has its own performance budget and runs in a separate
      # scheduled job once a stable CI baseline is recorded.
      - run: npm exec -- vitest run --exclude src/game/sim.stress.test.ts --pool=forks --maxWorkers=1
      - run: PFM_LOCAL_VERIFY=1 npm run build

  game-assets:
    name: 3D asset compression contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify-game-assets.mjs

  graphics-contract:
    name: Deterministic 3D benchmark contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm exec -- vitest run src/game/graphics-benchmark-contract.test.ts src/game/rapier-ball-authority.test.ts --pool=forks --maxWorkers=1
      - run: npm exec -- vite build --config scripts/graphics-vite.config.ts
      - uses: actions/upload-artifact@v4
        with:
          name: graphics-benchmark-bundle
          path: dist-benchmark
          if-no-files-found: error

  lighthouse:
    name: Lighthouse shell audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: PFM_LOCAL_VERIFY=1 npm run build
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .lighthouserc.cjs
          uploadArtifacts: true
          temporaryPublicStorage: false

  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
