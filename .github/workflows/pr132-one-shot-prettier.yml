name: PR 132 one-time exact formatting repair
on:
  push:
    branches:
      - integration/release-2026-11-11
    paths:
      - .github/workflows/pr132-one-shot-prettier.yml
permissions:
  contents: write
jobs:
  format-source:
    if: github.repository == 'davizeiro12345678/jogomanager'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Normalize only changed performance and nine-axis QA source
        run: |
          npm exec -- prettier --write \
            .github/scripts/pr132-nine-axis-qa.mjs \
            src/components/game/cinematic/CinematicProgramWarmup.tsx
      - name: Commit formatting to this integration branch only
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/scripts/pr132-nine-axis-qa.mjs src/components/game/cinematic/CinematicProgramWarmup.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style(pr132): satisfy strict Prettier in cinematic and nine-axis QA'
          git push origin HEAD:integration/release-2026-11-11
