limit_req_zone $binary_remote_addr zone=jm_catalog_ip:10m rate=100r/s;
server {
    listen 127.0.0.1:8080;
    server_name catalog.jogomanager.com;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    location = /v1/public/clubs {
        if ($request_method != GET) { return 405; }
        limit_req zone=jm_catalog_ip burst=120 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host "127.0.0.1";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 7s;
        proxy_pass http://127.0.0.1:3093;
    }
    location / { return 404; }
}