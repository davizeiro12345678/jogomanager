name: Auxiliary match worker
on:
  pull_request:
    paths:
      - 'services/match-aux/**'
      - 'services/match-authority/**'
      - 'src/game/online/**'
      - 'wrangler.match-authority.jsonc'
      - 'src/lib/match-aux-client.server.ts'
      - 'src/lib/multiplayer.functions.ts'
      - '.github/workflows/match-aux.yml'
  workflow_dispatch:
jobs:
  auxiliary-contract:
    name: Signed auxiliary match engine parity
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned main app dependencies
        run: npm ci
      - name: Install isolated MongoDB driver
        run: npm install --prefix services/match-aux --ignore-scripts --no-audit --no-fund
      - name: HMAC and replay contract tests
        run: node --import tsx --test services/match-aux/signature.test.mjs services/match-aux/engine.test.mjs
      - name: Strict TypeScript
        run: npm exec -- tsc --noEmit --pretty false
      - name: Lint and formatting
        run: npm run lint
      - name: Bundle Cloudflare match authority (dry-run, no credentials)
        run: npm exec -- wrangler deploy --config wrangler.match-authority.jsonc --dry-run
