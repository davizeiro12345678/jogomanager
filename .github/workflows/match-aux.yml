name: Auxiliary match worker
on:
  pull_request:
    paths:
      - "services/match-aux/**"
      - "src/lib/match-aux-client.server.ts"
      - "src/lib/multiplayer.functions.ts"
      - ".github/workflows/match-aux.yml"
  workflow_dispatch:
jobs:
  auxiliary-contract:
    name: Signed auxiliary match engine parity
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned main app dependencies
        run: npm ci
      - name: Install isolated MongoDB driver
        run: npm ci --prefix services/match-aux --ignore-scripts --no-audit --no-fund
      - name: HMAC and replay contract tests
        run: npm test --prefix services/match-aux
      - name: Strict TypeScript
        run: npm exec -- tsc --noEmit --pretty false
      - name: Lint and formatting
        run: npm run lint
  mongodb-contract:
    name: MongoDB driver persistence and claim fencing
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: services/match-aux/package-lock.json
      - run: npm ci --prefix services/match-aux --ignore-scripts --no-audit --no-fund
      - name: Verify isolated MongoDB persistence and competing claims
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017
        run: node --test services/match-aux/mongodb.integration.test.mjs
