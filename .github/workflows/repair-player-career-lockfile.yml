name: Repair player-career lockfile
on:
  push:
    branches:
      - fix/player-career-cloud-cas-rebased-20261015
    paths:
      - .github/workflows/repair-player-career-lockfile.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate lockfile without install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Check clean install resolves
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit validated lockfile to this feature branch
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(deps): reconcile npm lockfile with config 2.26.5"
            git push origin HEAD:fix/player-career-cloud-cas-rebased-20261015
          fi
