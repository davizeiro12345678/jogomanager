name: Match 3D startup CPU diagnostic

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/profile-public-startup.mjs"
      - ".github/workflows/match3d-startup-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: match3d-startup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_SHA: "5a75fef3662e3750917df1c2259169e4ed9f24d3"
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install isolated diagnostic tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/startup-profile" --no-package-lock --no-save playwright@1.62.1
          command -v google-chrome > "$RUNNER_TEMP/startup-chrome-path"
      - name: Prepare baseline
        run: |
          git worktree add --detach "$RUNNER_TEMP/startup-base" "$BASE_SHA"
          # Install the baseline's own lockfile. The candidate deliberately removes
          # the Lovable OAuth SDK, while this historical baseline still imports it;
          # sharing candidate node_modules makes the baseline unbuildable and biases
          # the comparison. Browser/profile tooling remains isolated in RUNNER_TEMP.
          (cd "$RUNNER_TEMP/startup-base" && npm ci)
          # Normalize only the old resolver alias incompatible with this audited
          # dependency graph; no baseline application behavior is changed.
          python3 - <<'PY'
          from pathlib import Path
          path = Path(__import__("os").environ["RUNNER_TEMP"]) / "startup-base/vite.config.ts"
          source = path.read_text()
          alias = '        entities: path.resolve(import.meta.dirname, "node_modules/entities"),\n'
          if source.count(alias) != 1:
              raise SystemExit("Unexpected historical entities alias; investigate baseline")
          path.write_text(source.replace(alias, "", 1))
          PY
      - name: Profile baseline then candidate with identical public fixtures
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/startup-profile/node_modules/playwright
        run: |
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE="$(cat "$RUNNER_TEMP/startup-chrome-path")"
          (cd "$RUNNER_TEMP/startup-base" && PFM_LOCAL_VERIFY=1 npm run build)
          node scripts/profile-public-startup.mjs "$RUNNER_TEMP/startup-base" "$RUNNER_TEMP/startup-evidence/baseline" 4175 "$BASE_SHA"
          PFM_LOCAL_VERIFY=1 npm run build
          node scripts/profile-public-startup.mjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/startup-evidence/candidate" 4176 "$CANDIDATE_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: match3d-startup-cpu
          path: ${{ runner.temp }}/startup-evidence
          if-no-files-found: error
          retention-days: 14
