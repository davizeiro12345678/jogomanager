name: Compare initial JavaScript bundles

on:
  workflow_call:
    inputs:
      baseline_ref:
        required: true
        type: string
      candidate_ref:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Baseline commit to compare on the same runner
        default: main~1
        required: true
        type: string
      candidate_ref:
        description: Candidate commit
        default: main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bundle-impact-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout candidate with complete base history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_ref }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify bundle comparison and historical resolver contracts
        run: |
          node --test scripts/normalize-baseline-entities-alias.test.mjs
          node --test scripts/bundle-baseline-resolver.test.mjs
      - name: Preserve candidate analyzers for baseline build
        run: |
          cp scripts/bundle-report.mjs "$RUNNER_TEMP/bundle-report.mjs"
          cp scripts/normalize-baseline-entities-alias.mjs "$RUNNER_TEMP/normalize-baseline-entities-alias.mjs"
      - name: Build baseline with its own locked dependency graph
        env:
          BASE_SHA: ${{ inputs.baseline_ref }}
        run: |
          git checkout --detach "$BASE_SHA"
          sha256sum package-lock.json > "$RUNNER_TEMP/baseline-dependency-lock.sha256"
          npm ci
          # Normalize only the exact historical bare alias; the test above
          # rejects unknown resolver shapes before this source-only adjustment.
          node "$RUNNER_TEMP/normalize-baseline-entities-alias.mjs" vite.config.ts
          cp "$RUNNER_TEMP/bundle-report.mjs" scripts/bundle-report.mjs
          rm -rf .output
          PFM_LOCAL_VERIFY=1 npm run build
          node scripts/bundle-report.mjs baseline .output/public/assets
          cp verification/bundle-2026-10-01/baseline.json "$RUNNER_TEMP/baseline.json"
      - name: Build candidate with its own locked dependency graph
        env:
          HEAD_SHA: ${{ inputs.candidate_ref }}
        run: |
          git checkout --detach "$HEAD_SHA"
          sha256sum package-lock.json > verification/bundle-2026-10-01/candidate-dependency-lock.sha256
          npm ci
          rm -rf .output
          PFM_LOCAL_VERIFY=1 npm run build
          node scripts/bundle-report.mjs candidate .output/public/assets
          cp "$RUNNER_TEMP/baseline.json" verification/bundle-2026-10-01/baseline.json
          cp "$RUNNER_TEMP/baseline-dependency-lock.sha256" verification/bundle-2026-10-01/baseline-dependency-lock.sha256
          node scripts/compare-bundle-reports.mjs \
            verification/bundle-2026-10-01/baseline.json \
            verification/bundle-2026-10-01/candidate.json --check
      - name: Upload reproducible comparison
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle-before-after
          path: |
            bundle-impact.md
            bundle-impact.json
            verification/bundle-2026-10-01/baseline.json
            verification/bundle-2026-10-01/candidate.json
            verification/bundle-2026-10-01/baseline-dependency-lock.sha256
            verification/bundle-2026-10-01/candidate-dependency-lock.sha256
          if-no-files-found: error
