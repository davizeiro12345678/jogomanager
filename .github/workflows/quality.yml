name: Quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm exec -- tsc --noEmit --pretty false
      # The complete deterministic stress suite runs in the required job below.
      - run: npm exec -- vitest run --exclude src/game/sim.stress.test.ts --pool=forks --maxWorkers=1
      - run: node --test cloudflare/sportsdb-importer/api-quota.test.mjs
      - run: node --test scripts/verify-public-deployment.test.mjs
      - run: node --test scripts/font-loading.test.mjs
      - run: node --test scripts/prepare-startup-baseline.test.mjs
      - run: node --test scripts/notification-outbox-worker.test.mjs
      - name: Verify Edge Function authentication and import contracts
        run: node --test scripts/edge-production-parity.test.mjs scripts/sportsdb-bridge.test.mjs scripts/football-materialize-realism.test.mjs
      - run: npm run test:performance-gates
      - run: PFM_LOCAL_VERIFY=1 npm run build
      - run: npm run bundle:check

  bundle-impact:
    name: Critical startup bundle comparison
    uses: ./.github/workflows/bundle-impact.yml
    with:
      baseline_ref: ${{ github.event.pull_request.base.sha || github.event.before || format('{0}^', github.sha) }}
      candidate_ref: ${{ github.event.pull_request.head.sha || github.sha }}

  simulation-stress:
    name: Critical 200-match deterministic stress
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Execute all 200 seeds and their independent replays
        run: npm run test:stress -- --reporter=default --reporter=json --outputFile=stress-results.json
      - name: Require executed and passing stress assertions
        run: node scripts/verify-stress-report.mjs stress-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulation-stress-results
          path: stress-results.json
          if-no-files-found: error

  match-setup-performance:
    name: Critical same-runner MatchSim construction
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Checkout baseline in a separate directory
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || format('{0}^', github.sha) }}
        run: git worktree add --detach .benchmark-base "$BASE_REF"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Use identical installed dependencies for both revisions
        run: ln -s "$GITHUB_WORKSPACE/node_modules" "$GITHUB_WORKSPACE/.benchmark-base/node_modules"
      - name: Compare CPU in ABBA order and verify deterministic checkpoints
        run: npm run perf:match-setup -- .benchmark-base . match-setup-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: match-setup-performance-results
          path: match-setup-results
          if-no-files-found: error

  critical-performance:
    name: Critical performance release gate
    if: always()
    needs:
      [
        verify,
        bundle-impact,
        simulation-stress,
        match-setup-performance,
        game-assets,
        graphics-contract,
        lighthouse,
        lighthouse-mobile,
      ]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every critical job to have passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e '
            const jobs = JSON.parse(process.env.RESULTS);
            const failed = Object.entries(jobs).filter(([, job]) => job.result !== "success");
            if (failed.length) {
              console.error("Critical performance gates did not pass:", failed.map(([name, job]) => `${name}: ${job.result}`).join(", "));
              process.exit(1);
            }
          '

  database-replay:
    name: Supabase migration replay and access contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify recorded migration history and preserved legacy files
        run: |
          node --test scripts/migration-replay-provenance.test.mjs
          node scripts/verify-migration-history.mjs
      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.2
      # These commands target the disposable local Docker database only.
      # No access token, production password, --linked, or remote DB URL is used.
      - name: Verify database startup failure handling
        run: node --test scripts/start-replay-db.test.mjs
      - name: Start local Supabase Postgres
        run: bash scripts/start-replay-db.sh
      - name: Replay the complete canonical migration history
        run: supabase db reset --local --no-seed --yes
      - name: Verify application schema, ownership, and grants
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f tests/sql/supabase-replay-contract.sql
      - name: Verify public catalog and bounded identity enrichment
        run: |
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f tests/sql/realism-catalog-readonly.sql
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f tests/sql/realism-profile-fixtures.sql
      - name: Verify future tables require explicit API grants
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f tests/sql/explicit-public-grants.sql
      - name: Verify private notification leases and post-delivery idempotency
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f tests/sql/notification-outbox-contract.sql

  game-assets:
    name: 3D asset compression contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/verify-game-assets.mjs

  graphics-contract:
    name: Deterministic 3D benchmark contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm exec -- vitest run src/game/graphics-benchmark-contract.test.ts src/game/rapier-ball-authority.test.ts --pool=forks --maxWorkers=1
      - run: npm exec -- vite build --config scripts/graphics-vite.config.ts
      - uses: actions/upload-artifact@v4
        with:
          name: graphics-benchmark-bundle
          path: dist-benchmark
          if-no-files-found: error

  lighthouse:
    name: Lighthouse shell audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: PFM_LOCAL_VERIFY=1 npm run build
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .lighthouserc.cjs
          uploadArtifacts: true
          temporaryPublicStorage: false

  lighthouse-mobile:
    name: Lighthouse mobile multi-page audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: PFM_LOCAL_VERIFY=1 npm run build
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .lighthouserc.mobile.cjs
          uploadArtifacts: true
          temporaryPublicStorage: false

  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high

  rust-wasm:
    name: Rust kernels and generated WASM parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master reviewed 2026-10-03
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm/crowd-visibility
      - run: npm ci
      - run: cargo fmt --manifest-path wasm/crowd-visibility/Cargo.toml -- --check
      - run: npm run wasm:test
      - run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Preserve shipped WASM for validation
        run: cp src/game/wasm/pkg/crowd_visibility_wasm_bg.wasm "$RUNNER_TEMP/crowd_visibility_wasm_bg.shipped.wasm"
      - name: Build WASM with an isolated tool cache
        run: npm run wasm:build
        env:
          PFM_WASM_PACK_CACHE: ${{ runner.temp }}/wasm-pack-cache
      - name: Verify generated bindings
        run: |
          git diff --exit-code -- \
            src/game/wasm/pkg/crowd_visibility_wasm.d.ts \
            src/game/wasm/pkg/crowd_visibility_wasm.js \
            src/game/wasm/pkg/crowd_visibility_wasm_bg.wasm.d.ts \
            src/game/wasm/pkg/package.json
          unexpected="$(git status --porcelain --untracked-files=all -- src/game/wasm/pkg | grep -v 'src/game/wasm/pkg/crowd_visibility_wasm_bg.wasm' || true)"
          test -z "$unexpected"
      - name: Verify freshly generated WASM parity
        run: npm exec -- vitest run src/game/wasm/crowd-visibility.test.ts src/game/wasm/crowd-visibility-parity.test.ts --pool=forks --maxWorkers=1
      - name: Verify shipped WASM parity
        run: |
          cp "$RUNNER_TEMP/crowd_visibility_wasm_bg.shipped.wasm" src/game/wasm/pkg/crowd_visibility_wasm_bg.wasm
          npm exec -- vitest run src/game/wasm/crowd-visibility.test.ts src/game/wasm/crowd-visibility-parity.test.ts --pool=forks --maxWorkers=1
