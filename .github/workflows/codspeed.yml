name: CodSpeed

on:
  push:
    branches: [main]
  pull_request:
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OpenID Connect authentication with CodSpeed

concurrency:
  group: codspeed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Run benchmarks
    # The required same-runner comparison lives in Quality gates. Keep this
    # additional instrumented history on a named image as well.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation,walltime
          run: npm run bench

  paired-benchmarks:
    name: PR 62 paired CodSpeed on one runner
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 62
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prepare identical dependencies for the integrated reference
        run: |
          git worktree add --detach .codspeed-base fd65b3d7616d6dd0544768fec1c645cedfe9dab6
          ln -s "$GITHUB_WORKSPACE/node_modules" "$GITHUB_WORKSPACE/.codspeed-base/node_modules"
          cmp package-lock.json .codspeed-base/package-lock.json
      - name: Measure all original workloads and catalogue on the same hardware
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation,walltime
          simulation-track-subprocess: "true"
          run: node scripts/paired-codspeed.mjs .codspeed-base .
