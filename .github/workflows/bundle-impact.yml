name: Compare initial JavaScript bundles

on:
  workflow_call:
    inputs:
      baseline_ref:
        required: true
        type: string
      candidate_ref:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Baseline commit to compare on the same runner
        default: main~1
        required: true
        type: string
      candidate_ref:
        description: Candidate commit
        default: main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bundle-impact-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout candidate with complete base history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_ref }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Preserve candidate analyzers and install one dependency graph
        run: |
          cp scripts/bundle-report.mjs "$RUNNER_TEMP/bundle-report.mjs"
          cp scripts/normalize-baseline-entities-alias.mjs "$RUNNER_TEMP/normalize-baseline-entities-alias.mjs"
          cp scripts/normalize-baseline-entities-alias.test.mjs "$RUNNER_TEMP/normalize-baseline-entities-alias.test.mjs"
          cp scripts/prepare-bundle-baseline-compat.mjs "$RUNNER_TEMP/prepare-bundle-baseline-compat.mjs"
          cp scripts/prepare-bundle-baseline-compat.test.mjs "$RUNNER_TEMP/prepare-bundle-baseline-compat.test.mjs"
          cp .github/workflows/bundle-impact.yml "$RUNNER_TEMP/bundle-impact.yml"
          cp package.json "$RUNNER_TEMP/bundle-package.json"
          cp package-lock.json "$RUNNER_TEMP/bundle-package-lock.json"
          npm ci
      - name: Build baseline using the candidate dependency graph
        env:
          BASE_SHA: ${{ inputs.baseline_ref }}
        run: |
          git checkout --detach "$BASE_SHA"
          # The baseline still imports an auth package removed by the candidate.
          # Install only its pinned, integrity-checked copy into the shared graph.
          node --test "$RUNNER_TEMP/prepare-bundle-baseline-compat.test.mjs"
          node "$RUNNER_TEMP/prepare-bundle-baseline-compat.mjs" package-lock.json "$RUNNER_TEMP/bundle-baseline-compat.json"
          # Both builds use the same candidate graph and, when needed, the
          # verified baseline-only compatibility package installed above.
          cp "$RUNNER_TEMP/bundle-package.json" package.json
          cp "$RUNNER_TEMP/bundle-package-lock.json" package-lock.json
          sha256sum package-lock.json > "$RUNNER_TEMP/baseline-dependency-lock.sha256"
          # Execute the candidate resolver contract against baseline source with
          # the same installed TypeScript dependency graph used for the candidate.
          mkdir -p "$RUNNER_TEMP/baseline-contract/scripts" "$RUNNER_TEMP/baseline-contract/.github/workflows"
          cp "$RUNNER_TEMP/normalize-baseline-entities-alias.mjs" "$RUNNER_TEMP/baseline-contract/scripts/"
          cp "$RUNNER_TEMP/normalize-baseline-entities-alias.test.mjs" "$RUNNER_TEMP/baseline-contract/scripts/"
          cp vite.config.ts "$RUNNER_TEMP/baseline-contract/vite.config.ts"
          cp "$RUNNER_TEMP/bundle-impact.yml" "$RUNNER_TEMP/baseline-contract/.github/workflows/bundle-impact.yml"
          node --test "$RUNNER_TEMP/baseline-contract/scripts/normalize-baseline-entities-alias.test.mjs"
          # Normalize only the exact historical bare alias after the contract passes.
          node "$RUNNER_TEMP/normalize-baseline-entities-alias.mjs" vite.config.ts
          rm -rf .output
          PFM_LOCAL_VERIFY=1 npm run build
          # Run the candidate analyzer with the shared node_modules.
          cp "$RUNNER_TEMP/bundle-report.mjs" scripts/bundle-report.mjs
          node scripts/bundle-report.mjs baseline .output/public/assets
          cp verification/bundle-2026-10-01/baseline.json "$RUNNER_TEMP/baseline.json"
          # Restore the checked-out tree before switching revisions; the baseline
          # analyzer and historical Vite alias normalization are temporary only.
          git checkout -- .
          git clean -fd
      - name: Build candidate using the same dependency graph
        env:
          HEAD_SHA: ${{ inputs.candidate_ref }}
        run: |
          git checkout --detach "$HEAD_SHA"
          cmp package.json "$RUNNER_TEMP/bundle-package.json"
          cmp package-lock.json "$RUNNER_TEMP/bundle-package-lock.json"
          sha256sum package-lock.json > verification/bundle-2026-10-01/candidate-dependency-lock.sha256
          rm -rf .output
          PFM_LOCAL_VERIFY=1 npm run build
          node scripts/bundle-report.mjs candidate .output/public/assets
          cp "$RUNNER_TEMP/baseline.json" verification/bundle-2026-10-01/baseline.json
          cp "$RUNNER_TEMP/baseline-dependency-lock.sha256" verification/bundle-2026-10-01/baseline-dependency-lock.sha256
          cp "$RUNNER_TEMP/bundle-baseline-compat.json" verification/bundle-2026-10-01/bundle-baseline-compat.json
          node scripts/compare-bundle-reports.mjs \
            verification/bundle-2026-10-01/baseline.json \
            verification/bundle-2026-10-01/candidate.json --check
      - name: Upload reproducible comparison
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle-before-after
          path: |
            bundle-impact.md
            bundle-impact.json
            verification/bundle-2026-10-01/baseline.json
            verification/bundle-2026-10-01/candidate.json
            verification/bundle-2026-10-01/baseline-dependency-lock.sha256
            verification/bundle-2026-10-01/candidate-dependency-lock.sha256
            verification/bundle-2026-10-01/bundle-baseline-compat.json
          if-no-files-found: error
