name: Compare initial JavaScript bundles

on:
  workflow_call:
    inputs:
      baseline_ref:
        required: true
        type: string
      candidate_ref:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Baseline commit to compare on the same runner
        default: main~1
        required: true
        type: string
      candidate_ref:
        description: Candidate commit
        default: main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bundle-impact-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout candidate with complete base history
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Preserve analyzer and install one dependency graph for both revisions
        run: |
          cp scripts/bundle-report.mjs "$RUNNER_TEMP/bundle-report.mjs"
          cp scripts/prepare-startup-baseline.mjs "$RUNNER_TEMP/baseline-compatibility.mjs"
          cp package.json "$RUNNER_TEMP/bundle-package.json"
          cp package-lock.json "$RUNNER_TEMP/bundle-package-lock.json"
          sha256sum package-lock.json > "$RUNNER_TEMP/bundle-dependency-lock.sha256"
          npm ci
      - name: Build baseline from PR base SHA
        env:
          BASE_SHA: ${{ inputs.baseline_ref }}
        run: |
          git checkout --detach "$BASE_SHA"
          # Isolate application-source changes using the candidate's exact,
          # audited dependency graph, as required by AGENTS.md. Both builds
          # keep their own source files and identical installed dependencies.
          cp "$RUNNER_TEMP/bundle-package.json" package.json
          cp "$RUNNER_TEMP/bundle-package-lock.json" package-lock.json
          node "$RUNNER_TEMP/baseline-compatibility.mjs" . "$RUNNER_TEMP/baseline-compatibility.json"
          rm -rf .output
          PFM_LOCAL_VERIFY=1 npm run build
          cp "$RUNNER_TEMP/bundle-report.mjs" scripts/bundle-report.mjs
          node scripts/bundle-report.mjs baseline .output/public/assets
          cp verification/bundle-2026-10-01/baseline.json "$RUNNER_TEMP/baseline.json"
          git restore scripts/bundle-report.mjs package.json package-lock.json
          git restore src/lib/real-football.functions.ts src/lib/email-templates vite.config.ts
      - name: Build proposed commit on the same runner
        env:
          HEAD_SHA: ${{ inputs.candidate_ref }}
        run: |
          git checkout --detach "$HEAD_SHA"
          cmp package.json "$RUNNER_TEMP/bundle-package.json"
          cmp package-lock.json "$RUNNER_TEMP/bundle-package-lock.json"
          rm -rf .output
          PFM_LOCAL_VERIFY=1 npm run build
          node scripts/bundle-report.mjs candidate .output/public/assets
          cp "$RUNNER_TEMP/baseline.json" verification/bundle-2026-10-01/baseline.json
          cp "$RUNNER_TEMP/bundle-dependency-lock.sha256" verification/bundle-2026-10-01/dependency-lock.sha256
          cp "$RUNNER_TEMP/baseline-compatibility.json" verification/bundle-2026-10-01/baseline-compatibility.json
          node scripts/compare-bundle-reports.mjs \
            verification/bundle-2026-10-01/baseline.json \
            verification/bundle-2026-10-01/candidate.json --check
      - name: Upload reproducible comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-before-after
          path: |
            bundle-impact.md
            bundle-impact.json
            verification/bundle-2026-10-01/baseline.json
            verification/bundle-2026-10-01/candidate.json
            verification/bundle-2026-10-01/dependency-lock.sha256
            verification/bundle-2026-10-01/baseline-compatibility.json
          if-no-files-found: error
