# Staging-only localhost canary. Not installed or served publicly by default.
# Requires: install -d -o www-data -g www-data -m 0750 /var/cache/nginx/jm-public-perf
# Do not include this config twice. All cacheable content is from ONE anonymous catalog path.
proxy_cache_path /var/cache/nginx/jm-public-perf levels=1:2 keys_zone=JMPublicCanary:16m max_size=64m inactive=5m use_temp_path=off;

server {
    listen 127.0.0.1:19444;
    server_name localhost;
    access_log off;
    gzip on;
    gzip_vary on;
    gzip_comp_level 2;
    gzip_min_length 1024;
    gzip_types application/json;
    location ~ ^/v1/public/(clubs|crests)$ {
        limit_except GET { deny all; }
        if ($http_authorization) { return 400; }
        if ($http_cookie) { return 400; }
        if ($http_x_api_key) { return 400; }
        if ($http_x_pfm_event_token) { return 400; }
        proxy_http_version 1.1;
        proxy_set_header Host catalog.jogomanager.com;
        proxy_set_header Connection "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-API-Key "";
        proxy_pass http://127.0.0.1:3092;
        proxy_buffering on;
        add_header X-JM-Perf-Mode baseline always;
    }
    location / { return 404; }
}
server {
    listen 127.0.0.1:19445;
    server_name localhost;
    access_log off;
    gzip on;
    gzip_vary on;
    gzip_comp_level 2;
    gzip_min_length 1024;
    gzip_types application/json;
    location ~ ^/v1/public/(clubs|crests)$ {
        limit_except GET { deny all; }
        if ($http_authorization) { return 400; }
        if ($http_cookie) { return 400; }
        if ($http_x_api_key) { return 400; }
        if ($http_x_pfm_event_token) { return 400; }
        proxy_http_version 1.1;
        proxy_set_header Host catalog.jogomanager.com;
        proxy_set_header Connection "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-API-Key "";
        proxy_pass http://127.0.0.1:3092;
        proxy_buffering on;
        proxy_cache JMPublicCanary;
        proxy_cache_key "$scheme|$request_method|$uri|$args";
        # Origin gateway intentionally sends private/no-store even for public catalog.
        # Explicitly override only inside this exact public route after auth headers are blocked.
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_valid 200 15s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_bypass $http_authorization $http_cookie $http_x_api_key;
        proxy_no_cache $http_authorization $http_cookie $http_x_api_key;
        add_header X-JM-Perf-Cache $upstream_cache_status always;
    }
    location / { return 404; }
}
