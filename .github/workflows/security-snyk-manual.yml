name: Manual security audit (Snyk)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snyk:
    name: Snyk OSS, Code and IaC (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SNYK_CFG_DISABLESUGGESTIONS: "true"
    steps:
      - name: Checkout pinned revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check required Snyk credential
        shell: bash
        run: |
          if [ -z "${SNYK_TOKEN}" ]; then
            echo "::error::SNYK_TOKEN GitHub Actions secret not configured. No scan was performed."
            exit 1
          fi

      - name: Install pinned Snyk CLI without package lifecycle scripts
        run: npm install --global snyk@1.1308.3 --ignore-scripts --no-audit --no-fund

      - name: Audit open-source dependencies (including dev)
        id: oss
        continue-on-error: true
        shell: bash
        run: |
          set +e
          snyk test --all-projects --dev --json-file-output="$RUNNER_TEMP/snyk-oss.json" > "$RUNNER_TEMP/snyk-oss.log" 2>&1
          result=$?
          echo "Snyk OSS exit code: $result (0=clean, 1=findings, 2+=error)"
          exit "$result"

      - name: Audit application source code
        id: code
        continue-on-error: true
        shell: bash
        run: |
          set +e
          snyk code test --json-file-output="$RUNNER_TEMP/snyk-code.json" > "$RUNNER_TEMP/snyk-code.log" 2>&1
          result=$?
          echo "Snyk Code exit code: $result (0=clean, 1=findings, 2+=error)"
          exit "$result"

      - name: Audit supported IaC declarations
        id: iac
        continue-on-error: true
        shell: bash
        run: |
          if ! find . -type f \( -name '*.tf' -o -name '*.tf.json' -o -name '*compose*.yml' -o -name '*compose*.yaml' -o -name 'kustomization.yaml' \) -print -quit | grep -q .; then
            echo "No matching supported IaC candidates in this checkout."
            exit 0
          fi
          set +e
          snyk iac test --recursive --json-file-output="$RUNNER_TEMP/snyk-iac.json" > "$RUNNER_TEMP/snyk-iac.log" 2>&1
          result=$?
          echo "Snyk IaC exit code: $result (0=clean, 1=findings, 2+=error)"
          exit "$result"

      - name: Final security gate
        if: always()
        shell: bash
        run: |
          echo "OSS: ${{ steps.oss.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Code: ${{ steps.code.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "IaC: ${{ steps.iac.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.oss.outcome }}" != "success" ] || [ "${{ steps.code.outcome }}" != "success" ] || [ "${{ steps.iac.outcome }}" != "success" ]; then
            echo "::error::At least one security scan found issues or failed."
            exit 1
          fi

# Reports are kept only on the short-lived runner and are deliberately not uploaded
# as public workflow artifacts. No remediation commands or active DAST traffic run.
