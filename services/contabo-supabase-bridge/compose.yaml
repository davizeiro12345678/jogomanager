name: jogomanager-aux
services:
  supabase-bridge:
    image: node:24-bookworm-slim
    user: "10001:10001"
    network_mode: host
    working_dir: /app
    command: ["node", "--disable-proto=throw", "/app/server.mjs"]
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.75
    tmpfs:
      - /tmp:size=16m,mode=1777
    env_file:
      - /etc/jogomanager/supabase-bridge.env
    volumes:
      - ./server.mjs:/app/server.mjs:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3088/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
