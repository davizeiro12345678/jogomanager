# Localhost-only performance canary for public JogoManager club catalog.
# Staging only. Not for Auth, Stripe, purchases, careers, match rooms or private data.
# Before nginx -t: install -d -o www-data -g www-data -m 0750 /var/cache/nginx/jm-edge-canary
proxy_cache_path /var/cache/nginx/jm-edge-canary levels=1:2 keys_zone=JM_EDGE_CANARY:8m max_size=32m inactive=3m use_temp_path=off;
server {
    listen 127.0.0.1:19445;
    server_name localhost;
    access_log off;
    location = /v1/public/clubs {
        if ($request_method != GET) { return 405; }
        if ($http_authorization) { return 400; }
        if ($http_cookie) { return 400; }
        if ($http_x_api_key) { return 400; }
        if ($http_x_pfm_event_token) { return 400; }
        proxy_http_version 1.1;
        proxy_set_header Host catalog.jogomanager.com;
        proxy_set_header Connection "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-API-Key "";
        proxy_pass http://127.0.0.1:3092;
        proxy_buffering on;
        proxy_cache JM_EDGE_CANARY;
        proxy_cache_key "$request_method$request_uri";
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_valid 200 20s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_use_stale updating;
        add_header X-PFM-Edge-Canary $upstream_cache_status always;
    }
    location / { return 404; }
}
