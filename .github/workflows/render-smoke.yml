name: Cutscene and match visual smoke
on:
  pull_request:
    paths:
      - "src/components/game/**"
      - "src/game/**"
      - "src/pages/match.tsx"
      - "src/pages/pre-jogo.tsx"
      - "scripts/qa-render-smoke.mjs"
      - ".github/workflows/render-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run graphics:build
      - name: Capture slow cutscene and match
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/render-qa/node_modules/playwright
        run: |
          npm install --prefix "$RUNNER_TEMP/render-qa" --no-package-lock --no-save playwright@1.62.1
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE="$(command -v google-chrome)"
          node scripts/qa-render-smoke.mjs "$RUNNER_TEMP/render-smoke"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cutscene-match-visual-smoke
          path: ${{ runner.temp }}/render-smoke
          if-no-files-found: warn
